<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soulful Yoga Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  :root{ --zoom:1; }
  *{box-sizing:border-box; margin:0;}
  html,body{background:var(--stageBg); font-family:var(--body); color:var(--ink);}
  body{min-height:100vh; display:flex; justify-content:center; align-items:flex-start; gap:32px; padding:24px 16px; flex-wrap:wrap;}

  /* ── Testpaneel ────────────────────────────────────────────────────── */
  .panel-side{width:300px; display:flex; flex-direction:column; gap:14px;}
  .box{background:#f7f2e8; border:1px solid #d8ccb6; border-radius:16px; padding:16px;}
  .box h1{font:600 20px var(--display);}
  .box h2{font:600 11px var(--body); letter-spacing:.12em; text-transform:uppercase; color:#8a7f6e; margin-bottom:10px;}
  .box p{font-size:12.5px; line-height:1.5; color:#6b6153;}
  .who{display:flex; flex-direction:column; gap:6px;}
  .who button{display:flex; align-items:center; gap:10px; text-align:left; font:inherit; background:#fff; border:1px solid #d8ccb6; border-radius:12px; padding:9px 11px; cursor:pointer; color:var(--ink);}
  .who button:hover{border-color:var(--ink);}
  .who button.on{border:2px solid var(--rani); padding:8px 10px;}
  .who .av{width:30px; height:30px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font:700 11px var(--body); color:#fff; background:var(--teal);}
  .who .av.admin{background:var(--ink);} .who .av.guest{background:#AFC0B3;}
  .who .n{font-weight:600; font-size:13px;} .who .d{font-size:11.5px; color:#7d7262;}
  .sbtn{font:600 12.5px var(--body); border:1px solid #cdbfa6; background:#fff; color:var(--ink); border-radius:10px; padding:8px 12px; cursor:pointer; width:100%;}
  .sbtn:hover{border-color:var(--ink);} .sbtn:disabled{opacity:.45; cursor:not-allowed;}
  .sbtn + .sbtn{margin-top:8px;}
  select.sbtn{appearance:auto;}
  .log{list-style:none; padding:0; display:flex; flex-direction:column; gap:6px; max-height:220px; overflow:auto;}
  .log li{font-size:12px; line-height:1.4; color:#4d4438; border-left:3px solid var(--sand); padding-left:8px;}
  .log li time{color:#a09581; font-variant-numeric:tabular-nums; margin-right:4px;}
  .tips{padding-left:18px; font-size:12.5px; line-height:1.55; color:#4d4438;}
  .tips li + li{margin-top:4px;}
  .link{font-size:12.5px; color:var(--rani); font-weight:600;}

  /* ── Interactie in de telefoon ─────────────────────────────────────── */
  .phone{height:min(800px, calc(100vh - 48px)); min-height:620px; flex:none;}
  .phone [data-act]{cursor:pointer;}
  .phone [data-act="noop"]{cursor:default;}
  .ccard,.row,.acard,.abtn,.vcard{transition:transform .12s ease;}
  .ccard:active,.row[data-act]:active,.acard:active,.abtn:active{transform:scale(.98);}
  .cta[data-act]:hover{filter:brightness(1.06);}
  .cta.off{cursor:not-allowed !important;}
  .sb[data-act]:active,.circ[data-act]:active{transform:scale(.9);}
  .sheet{animation:up .22s ease-out;}
  .wcard{animation:pop .18s ease-out;}
  .toast{animation:drop .25s ease-out;}
  @keyframes up{from{transform:translateY(100%);}}
  @keyframes pop{from{transform:scale(.94); opacity:0;}}
  @keyframes drop{from{transform:translate(-50%,-20px); opacity:0;}}
  .field input{width:100%; font:400 14.5px var(--body); color:var(--ink); background:var(--card); border:1px solid var(--sand); border-radius:var(--r-btn); padding:13px 16px;}
  .field input:focus{outline:2px solid var(--rani); outline-offset:0; border-color:transparent;}
  .field textarea{width:100%; font:400 14.5px/21px var(--body); color:var(--ink); background:var(--card); border:1px solid var(--sand); border-radius:var(--r-btn); padding:13px 16px; resize:vertical;}
  .field textarea:focus,.chatbar .cin:focus{outline:2px solid var(--rani); outline-offset:0; border-color:transparent;}
  .chatbar .cin{color:var(--ink);}
  .pushbanner{cursor:pointer; animation:drop2 .25s ease-out;}
  @keyframes drop2{from{transform:translateY(-20px); opacity:0;}}
  .err{font:500 12.5px var(--body); color:var(--rani); margin-bottom:14px;}
  .quick span[data-act].on{background:var(--ink); color:var(--ivory); border-color:var(--ink);}

  @media (max-width:720px){ .panel-side{width:100%; max-width:395px; order:2;} }
</style>
</head>
<body>

<div class="phone" id="phone"></div>

<div class="panel-side" id="side"></div>

<script src="demo-core.js"></script>
<script>
// Navigatie en tijdelijke UI — niet bewaard
const UI = { chatDraft:'', push:null, form:{}, formError:null, tab:'rooster', month:0, myTab:'komend', stack:[], sheet:null, prompt:null, confirm:null, toast:null, filter:'alles', picking:false, loginError:null, loginEmail:'', loginPw:'', av:{email:'', walkin:''} };
/* ── Bouwstenen ─────────────────────────────────────────────────────── */
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON = {
  rooster:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
  lessen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M8.5 14.5l2.5 2.5 4.5-5"/></svg>',
  videos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l6 3-6 3z" fill="currentColor" stroke="none"/></svg>',
  berichten:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 3.5V17H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5"/></svg>',
  profiel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>',
};
const header = ({eyebrow, title, subtitle='', back, photo}) => `
  <div class="topbar">
    ${back ? `<div class="back" data-act="back">‹ ${back}</div>` : ''}
    <div class="hrow"><div class="txt">
      ${eyebrow ? `<div class="eyebrow">${esc(eyebrow)}</div>` : ''}
      <h1>${esc(title)}</h1><p>${esc(subtitle)}</p>
    </div><img src="${photo || 'logo-mark.png'}" class="${photo ? 'hphoto' : ''}" alt=""></div>
  </div>`;
// Video's staat verborgen tot er video's zijn; Berichten neemt die plek in.
const tabs = () => isAdmin()
  ? [['rooster','Rooster'],['berichten','Berichten'],['profiel','Profiel']]
  : [['rooster','Rooster'],['lessen','Mijn lessen'],['berichten','Berichten'],['profiel','Profiel']];
// Rood getal op de tab Berichten: ongelezen nieuws en chat (beheerder: gesprekken met nieuwe berichten).
const berichtenBadge = () => { const u = me(); return !u ? 0 : u.role === 'admin' ? studioUnread() : unreadNews(u.email) + unreadChat(u.email); };
const tabbar = () => `<div class="tabbar">${tabs().map(([k,l]) => { const n = k === 'berichten' ? berichtenBadge() : 0;
  return `<div class="tab ${UI.tab===k?'on':''}" data-act="tab" data-v="${k}">${n ? `<span class="tdot">${n}</span>` : ''}${ICON[k]}${l}</div>`; }).join('')}</div>`;
const dot = (s, sm) => `<div class="dot ${sm?'sm':''} ${s}">${STYLE[s].dot}</div>`;
const stepper = (act, v, extra='') => `<div class="stepper"><div class="sb" data-act="${act}" data-d="-1" ${extra}>–</div><div class="sv">${v}</div><div class="sb" data-act="${act}" data-d="1" ${extra}>+</div></div>`;
const initials = (n) => n.split(' ').filter(w => /^\p{L}/u.test(w)).map(w => w[0]).join('').slice(0,2).toUpperCase();
const at = (sid, d) => `data-sid="${sid}" data-date="${d}"`;
const vastLabel = (u) => { const e = S.enrollments.find(x => x.email === u.email && isActiveEnrollment(x)); return e ? `${SES[e.sessionId].day.toLowerCase()} ${SES[e.sessionId].time.split(' – ')[0]}` : null; };

/* ── Tab: Rooster (één maand per pagina) ────────────────────────────── */
function monthDays(offset){
  const first = monthStart(offset);
  const from = offset === 0 ? isoOf(now()) : isoOf(first);
  const out = [];
  for (let d = from; toDate(d).getMonth() === first.getMonth(); d = plusDays(d, 1)) {
    const classes = sessionsOn(d).filter(c => !hasStarted(c.id, d));
    if (classes.length) out.push({d, classes});
  }
  return out;
}
// Tag for a cancelled lesson in Mijn lessen: late cancellations cost a strip.
const cancelledTag = (l, past) => cancellationOf(me().email, l.sid, l.d)?.charged
  ? '<span class="tag open">Afgemeld binnen 24 uur · −1 strip</span>'
  : `<span class="tag off">Afgemeld · ${past ? 'telde' : 'telt'} niet mee</span>`;
function spotLabel(sid, d){
  if (closureOf(sid, d)) return ['Vervalt', ''];
  const u = me();
  if (u?.role === 'student') {
    const st = statusFor(u.email, sid, d);
    if (st?.cancelled) return ['Afgemeld', ''];
    if (st?.source === 'aanvraag') return ['Aangevraagd', 'pend'];
    if (st) return ['✓ Ingepland', 'mine'];
  }
  const o = occ(sid, d);
  return o.available <= 0 ? ['Vol', 'full'] : [`${o.available}/${o.cap} beschikbaar`, ''];
}
// Maandoverzicht: raster ma–zo met een gekleurd bolletje per les; tik op een dag om erheen te springen.
function monthCalendar(m){
  const first = monthStart(m); const today = isoOf(now());
  const lead = (first.getDay() + 6) % 7;
  const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const cells = [...Array(lead).fill(null), ...Array.from({length: days}, (_, i) => isoOf(new Date(first.getFullYear(), first.getMonth(), i + 1)))];
  while (cells.length % 7) cells.push(null);
  const lessons = (d) => sessionsOn(d).filter(s => !closureOf(s.id, d)).map(s => s.style);
  const used = ['yin', 'flow', 'gentle'].filter(st => cells.some(d => d && lessons(d).includes(st)));
  return `<div class="mcal"><div class="wk">${['ma','di','wo','do','vr','za','zo'].map(w => `<div class="wd">${w}</div>`).join('')}</div>
    ${Array.from({length: cells.length / 7}, (_, w) => `<div class="wk">${cells.slice(w * 7, w * 7 + 7).map(d => {
      if (!d) return '<div class="cell"></div>';
      const ls = lessons(d); const past = d < today;
      return `<div class="cell ${d === today ? 'today' : ''}" ${!past && ls.length ? `data-act="calDay" data-date="${d}"` : ''}>
        <span class="num ${past ? 'past' : ls.length ? 'les' : ''}">${Number(d.slice(8))}</span><span class="dots ${past ? 'past' : ''}">${ls.slice(0, 3).map(st => `<i class="${st}"></i>`).join('')}</span></div>`; }).join('')}</div>`).join('')}
    ${used.length ? `<div class="legend">${used.map(st => `<span><span class="dots"><i class="${st}"></i></span>${STYLE[st].label}</span>`).join('')}</div>` : ''}</div>`;
}
function roosterTab(){
  const m = UI.month;
  const label = (o) => { const d = monthStart(o); return `${cap1(MONTHS[d.getMonth()])} ${d.getFullYear()}`; };
  const nav = `<div class="monthnav">
    <div class="mbtn ${m === 0 ? 'off' : ''}" ${m === 0 ? '' : 'data-act="month" data-d="-1"'}>‹</div>
    <div class="mlabel">${label(m)}${m === 0 ? '<small>resterende lessen</small>' : ''}</div>
    <div class="mbtn ${m === MONTHS_AHEAD ? 'off' : ''}" ${m === MONTHS_AHEAD ? '' : 'data-act="month" data-d="1"'}>›</div></div>`;
  const days = monthDays(m);
  const h = days.length ? days.map(({d, classes}, i) =>
    `<div class="day ${i === 0 ? 'first' : ''} ${i > 0 && toDate(d).getDay() === 1 ? 'week' : ''}" id="day-${d}">${dateLabel(d)}</div>` +
    classes.map(c => { const [txt, cls] = spotLabel(c.id, d);
      const cl = closureOf(c.id, d);
      return `<div class="ccard ${cl ? 'closed' : ''}" data-act="openClass" ${at(c.id, d)}>${dot(c.style)}<div class="meta"><div class="nm">${STYLE[c.style].label}${isExtra(c) ? ' <span class="tag pend" style="margin:0 0 0 4px">Extra</span>' : ''}</div><div class="tm">${c.time}${cl ? ` · ${esc(cl.reason)}` : ''}</div></div>
        <div class="spots ${cls}">${txt}</div><div class="chev">›</div></div>`; }).join('')).join('')
    : `<div class="empty" style="margin-top:36px">Geen lessen meer in ${MONTHS[monthStart(m).getMonth()]}.</div>
       ${m < MONTHS_AHEAD ? `<div class="cta" style="margin-top:18px" data-act="month" data-d="1">Bekijk ${MONTHS[monthStart(m + 1).getMonth()]} ›</div>` : ''}`;
  return header({eyebrow: isAdmin() ? 'Beheerder' : undefined, title:'Soulful Yoga', subtitle:'Meer rust en ruimte voor jezelf'}) + nav + `<div class="content">${monthCalendar(m)}${h}</div>`;
}

/* ── Tab: Mijn lessen ───────────────────────────────────────────────── */
function lessonCard(l, past){
  const s = SES[l.sid]; const dt = toDate(l.d);
  const charge = past ? chargeFor(S.email, l.sid, l.d) : undefined;
  const dim = l.st.cancelled || l.closed || charge === 'afwezig';
  let tag, btn = '';
  if (l.closed) {
    tag = `<span class="tag off">${past ? 'Vervallen' : 'Vervalt'} · ${esc(l.closed.reason.toLowerCase())} · geen strip</span>`;
  } else if (past) {
    tag = l.st.cancelled ? cancelledTag(l, true)
      : charge === undefined ? '<span class="tag pend">Wacht op bevestiging docent</span>'
      : charge === 'afwezig' ? '<span class="tag off">Niet aanwezig · geen strip</span>'
      : charge === 'open' ? '<span class="tag open">Aanwezig · geen strippen, openstaand</span>'
      : '<span class="tag paid">Afgenomen · −1 strip</span>';
  } else if (l.st.cancelled) {
    tag = cancelledTag(l, false);
    if (!hasStarted(l.sid, l.d) && occ(l.sid, l.d).available > 0) btn = `<div class="obtn teal" data-act="undoCancel" ${at(l.sid, l.d)}>Aanmelden</div>`;
  } else if (l.st.source === 'aanvraag') {
    tag = '<span class="tag pend">Aangevraagd · wacht op goedkeuring</span>';
  } else {
    tag = `<span class="tag ${l.st.source}">${l.st.source === 'vast' ? 'Vaste les' : 'Losse les'}</span>`;
    if (!hasStarted(l.sid, l.d)) btn = `<div class="obtn" data-act="askCancel" ${at(l.sid, l.d)}>Afmelden</div>`;
  }
  return `<div class="lcard ${dim ? 'dim' : ''}"><div class="datebox ${s.style}"><b>${dt.getDate()}</b><span>${WEEKDAYS[dt.getDay()].slice(0,2)}</span></div>
    <div class="meta"><div class="nm">${STYLE[s.style].label}</div><div class="tm">${s.time}</div>${tag}</div>${btn}</div>`;
}
function lessenTab(){
  const u = me();
  if (!u) return header({title:'Mijn lessen', subtitle:'Je planning en geschiedenis'}) +
    `<div class="info-c"><div class="ic">🧘</div><p>Log in om te zien voor welke lessen je bent ingepland.</p><div class="cta" data-act="tab" data-v="profiel">Inloggen</div></div>`;
  const today = isoOf(now());
  const all = myLessons(u.email, '2000-01-01', horizonEnd());
  const upcoming = all.filter(l => !isPast(l.sid, l.d));
  const past = all.filter(l => isPast(l.sid, l.d) && l.st.source !== 'aanvraag').reverse();
  const vast = vastLabel(u);
  const strip = u.strippen === null ? 'Geen kaart' : `${u.strippen} <small>/ ${u.total} over</small>`;
  let list = '';
  if (UI.myTab === 'komend') {
    let lastMonth = -1;
    list = upcoming.length ? upcoming.map(l => {
      const m = toDate(l.d).getMonth();
      const head = m !== lastMonth ? `<div class="sect" style="padding:0;margin:${lastMonth === -1 ? 4 : 18}px 0 8px">${cap1(MONTHS[m])}</div>` : '';
      lastMonth = m; return head + lessonCard(l, false);
    }).join('') : `<div class="empty">Je staat nog nergens voor ingepland.</div><div class="cta" style="margin-top:18px" data-act="tab" data-v="rooster">Bekijk het rooster</div>`;
  } else {
    list = past.length ? past.map(l => lessonCard(l, true)).join('') : '<div class="empty">Nog geen lessen afgenomen.</div>';
  }
  return header({title:'Mijn lessen', subtitle: vast ? `Vaste les: ${vast}` : 'Geen vaste les'}) +
    `<div class="ministrip"><span class="l">Strippenkaart</span><span class="c">${strip}</span></div>
     <div class="cancelrule">Kosteloos afmelden tot ${LATE_CANCEL_HOURS} uur voor aanvang. Daarna gaat er 1 strip af.</div>
     <div class="seg"><div class="${UI.myTab === 'komend' ? 'on' : ''}" data-act="myTab" data-v="komend">Komend (${upcoming.filter(l => !l.st.cancelled && !l.closed).length})</div>
       <div class="${UI.myTab === 'afgenomen' ? 'on' : ''}" data-act="myTab" data-v="afgenomen">Afgenomen (${past.filter(l => ['strip', 'open', 'los'].includes(chargeFor(u.email, l.sid, l.d))).length})</div></div>
     <div class="pad" style="padding-top:8px">${list}</div>`;
}

/* ── Tab: Video's ───────────────────────────────────────────────────── */
function videosTab(){
  const list = VIDEOS.filter(v => UI.filter === 'alles' || v.s === UI.filter);
  if (!VIDEOS.length) return header({title:"Video's", subtitle:'Oefen op jouw moment, in jouw tempo'}) + `<div class="soon"><div class="soon-ic"></div><h3>Video's volgen binnenkort</h3><p>Straks kun je hier thuis oefenen met video's van Yin, Flow en Gentle Yoga, op jouw moment en in jouw tempo.</p></div>`;
  return header({title:"Video's", subtitle:'Oefen op jouw moment, in jouw tempo'}) +
    `<div class="filters">${[['alles','Alles'],['yin','Yin'],['flow','Flow'],['gentle','Gentle']].map(([k,l]) => `<div class="chip ${UI.filter===k?'on':''}" data-act="filter" data-v="${k}">${l}</div>`).join('')}</div>
     <div style="padding:10px 0 24px">${list.map(v => `<div class="vcard"><div class="thumb ${v.s}"><div class="play"></div></div><div class="vinfo"><div class="nm">${v.t}</div><div class="sb2">${v.m} min · ${v.l}</div></div></div>`).join('')}</div>`;
}

/* ── Tab: Berichten (nieuws + chat) ─────────────────────────────────── */
const newsCard = (n, email) => `<div class="ncard ${email && n.at > (S.read[email]?.news || '') ? 'new' : ''}" data-act="openNews" data-id="${n.id}">
  <div class="nt">${esc(n.title)}</div><div class="nb">${esc(n.body)}</div><div class="nd">${msgTime(n.at)}</div></div>`;
// Marjolijn beantwoordt de chat: haar foto staat bij het gesprek.
const TEACHER_PHOTO = 'marjolijn.jpg';
const logoAv = `<div class="av photo"><img src="${TEACHER_PHOTO}" alt="Marjolijn"></div>`;
function berichtenTab(){
  const u = me(); const news = newsList(); const admin = u?.role === 'admin';
  // Chat bovenaan, nieuws daaronder.
  const newsBlock = `<div class="msect" style="margin-top:18px"><div class="sect">Nieuws</div>${admin ? '<a data-act="push" data-v="nieuws-schrijven">＋ Schrijven</a>' : news.length > 2 ? '<a data-act="push" data-v="nieuws">Alle nieuws ›</a>' : ''}</div>
    ${news.length ? news.slice(0, admin ? 3 : 2).map(n => newsCard(n, admin ? null : u?.email)).join('') : '<div class="empty" style="margin:6px 0 14px">Nog geen nieuws.</div>'}
    ${admin && news.length > 3 ? '<div class="logout" style="margin-top:4px" data-act="push" data-v="nieuws">Alle nieuws</div>' : ''}`;
  if (admin) {
    const convs = conversations();
    return header({eyebrow:'Docentmodus', title:'Berichten', subtitle:'Gesprekken met klanten en nieuws'}) + `<div class="pad">
      <div class="msect"><div class="sect">Gesprekken</div><a data-act="push" data-v="chat-kiezen">＋ Nieuw gesprek</a></div>
      ${convs.length ? convs.map(c => { const k = userBy(c.email);
        return `<div class="chatrow ${c.unread ? 'unread' : ''}" data-act="openChat" data-email="${c.email}"><div class="ini">${initials(k.name)}</div>
          <div class="meta"><div class="top"><span class="nm">${esc(k.name)}</span><span class="tm">${msgTime(c.last.at)}</span></div>
          <div class="last">${c.last.from === 'studio' ? 'Jij: ' : ''}${esc(c.last.text)}</div></div>${c.unread ? `<span class="cnt">${c.unread}</span>` : ''}</div>`; }).join('')
        : '<div class="empty">Nog geen gesprekken.</div>'}
      ${newsBlock}</div>`;
  }
  const chat = u ? chatOf(u.email) : []; const last = chat.at(-1); const unread = u ? unreadChat(u.email) : 0;
  return header({title:'Berichten', subtitle:'Je chat met Marjolijn en het laatste nieuws'}) + `<div class="pad">
    <div class="msect"><div class="sect">Chat</div></div>
    ${u ? `<div class="chatrow ${unread ? 'unread' : ''}" data-act="openChat" data-email="${u.email}">${logoAv}
        <div class="meta"><div class="top"><span class="nm">Marjolijn</span>${last ? `<span class="tm">${msgTime(last.at)}</span>` : ''}</div>
        <div class="last">${last ? `${last.from === 'klant' ? 'Jij: ' : ''}${esc(last.text)}` : 'Stel je vraag aan Marjolijn'}</div></div>${unread ? `<span class="cnt">${unread}</span>` : ''}</div>`

        ${list.map(u => `<div class="row tight" data-act="openChat" data-email="${u.email}"><div class="ini">${initials(u.name)}</div><div class="meta"><div class="nm">${esc(u.name)}</div><div class="em">${esc(u.email)}</div></div><div class="chev">›</div></div>`).join('')}</div>`; },

      <div class="field"><label>Bericht</label><textarea data-f="body" rows="7" placeholder="Wat wil je je klanten laten weten?">${esc(UI.form.body || '')}</textarea></div>

      `<div class="pad form">
        <div class="field"><label>Naam</label><input type="text" data-f="name" value="${esc(UI.form.name || '')}" placeholder="Voor- en achternaam" autocomplete="name"></div>

  // Weekrooster + uitzonderingen (extra lessen en vervallen lessen)
  'rooster-beheer': () => {
    const today = isoOf(now());
    const order = (s) => (WEEKDAYS.indexOf(s.day) + 6) % 7;
    const weekly = S.sessions.filter(s => !isExtra(s) && (!s.until || s.until >= today) && (!s.from || !s.until || s.until >= s.from))
      .sort((a, b) => order(a) - order(b) || a.time.localeCompare(b.time));
    const extras = S.sessions.filter(s => isExtra(s) && s.from >= today).sort((a, b) => a.from.localeCompare(b.from));
    const closures = S.closures.filter(c => c.to >= today).sort((a, b) => a.from.localeCompare(b.from));
    const period = (s) => [s.from && s.from > today ? `vanaf ${shortDate(s.from)}` : '', s.until ? `t/m ${shortDate(s.until)}` : ''].filter(Boolean).join(' · ');
    return header({back:'Terug', eyebrow:'Docentmodus', title:'Rooster beheren', subtitle:'Weekrooster en uitzonderingen'}) +

        ${(S.accountRequests || []).length ? `<div class="reqbox"><div class="sect" style="padding:0;margin-bottom:4px">Accountaanvragen · ${S.accountRequests.length}</div>

            <div class="twobtn" style="margin-top:10px"><div class="cta" style="background:var(--teal);padding:10px 0;font-size:13px" data-act="approveRequest" data-id="${r.id}">✓ Account aanmaken</div><div class="cta outline" style="padding:8.5px 0;font-size:13px" data-act="askRejectRequest" data-id="${r.id}">Weigeren</div></div></div>`).join('')}</div>` : ''}
        <div class="field" style="margin-bottom:10px"><input type="text" data-f="kq" value="${esc(f.kq || '')}" placeholder="Zoek op naam of e-mail"></div>
        <div class="orglegend"><span><i style="background:#CFE7DA"></i>${ORIGIN_LABEL.aanvraag}</span><span><i style="background:#F6DDAF"></i>${ORIGIN_LABEL.beheer}</span></div>
        ${list.map(u => { const v = vastLabel(u); return `<div class="row tight"><div class="ini org-${u.origin}" data-act="openKlant" data-email="${u.email}">${initials(u.name)}</div>
          <div class="meta" data-act="openKlant" data-email="${u.email}"><div class="nm">${esc(u.name)}</div><div class="st">${u.strippen === null ? 'geen kaart' : `${u.strippen} lessen over`}${v ? ` · vast: ${v}` : ''}</div></div>
          <div class="adj"><div class="circ" data-act="userStrip" data-email="${u.email}" data-d="-1">–</div><div class="circ" data-act="userStrip" data-email="${u.email}" data-d="1">+</div><div class="obtn teal" data-act="askCard" data-email="${u.email}">+10</div></div></div>`; }).join('') || '<div class="empty">Geen klant gevonden.</div>'}</div>`;
  },

  reserveringen: () => header({back:'Terug', eyebrow:'Docentmodus', title:'Reserveringen', subtitle:'Tik op een aanvraag om te beoordelen'}) +
    `<div class="pad">${S.requests.length ? S.requests.map(r => { const s = SES[r.sessionId]; return `<div class="row" style="gap:14px" data-act="openRequest" data-id="${r.id}">${dot(s.style, true)}
      <div class="meta"><div class="nm">${esc(r.name)}</div><div class="dt">${STYLE[s.style].label} · ${dateLabel(r.date)} · ${s.time}</div><div class="em">${esc(r.email)}</div></div><div class="chev">›</div></div>`; }).join('')
      : '<div class="empty" style="margin-top:40px">Nog geen aanvragen</div>'}</div>`,

  // Docentmodus: lessen van vandaag + eerdere lessen waarvan de presentie nog bevestigd moet worden.
  vandaag: () => {
    const d = isoOf(now());
    const todo = unconfirmedLessons(14).filter(l => l.d !== d);
    const card = (c, dd) => {
      const cl = closureOf(c.id, dd); const conf = confirmationOf(c.id, dd); const o = occ(c.id, dd);
      const when = dd === d ? c.time : `${shortDate(dd)} · ${c.time}`;
      if (cl) return `<div class="acard closed">${dot(c.style)}<div class="meta"><div class="nm">${STYLE[c.style].label}</div><div class="tm">${when} · ${esc(cl.reason)}</div></div><div class="pill" style="background:var(--sand);color:var(--ink)">Vervalt</div></div>`;
      const pill = conf ? '<div class="pill">✓ Bevestigd</div>' : hasStarted(c.id, dd) ? '<div class="pill full">Bevestigen</div>' : `<div class="pill" style="background:var(--sand);color:var(--ink)">${o.booked} / ${o.cap}</div>`;
      return `<div class="acard" data-act="push" data-v="roster" ${at(c.id, dd)}>${dot(c.style)}<div class="meta"><div class="nm">${STYLE[c.style].label}</div><div class="tm">${when}</div></div>${pill}</div>`;
    };
    const classes = sessionsOn(d);
    return header({back:'Terug', eyebrow:'Docentmodus', title:'Vandaag', subtitle:dateLabel(d)}) +
      `<div class="pad">${classes.length ? classes.map(c => card(c, d)).join('') : '<div class="empty" style="margin-bottom:20px">Geen lessen vandaag</div>'}
        ${todo.length ? `<div class="sect" style="padding:0;margin:18px 0 8px">Nog te bevestigen</div><div class="small-note">Eerdere lessen waarvan de presentie nog niet is bevestigd. Pas na bevestigen gaan de strippen af.</div>${todo.map(l => card(SES[l.sid], l.d)).join('')}` : ''}</div>`;
  },

  // Presentielijst: planning als startpunt, de beheerder corrigeert en bevestigt; pas dan gaan de strippen af.
  roster: ({sid, d}) => {
    const s = SES[sid]; const conf = confirmationOf(sid, d); const started = hasStarted(sid, d);
    const top = header({back:'Vandaag', eyebrow:`${STYLE[s.style].label} · ${shortDate(d)}`, title:s.time, subtitle: conf ? `Bevestigd · ${conf.at}` : 'Klopt de planning met wie er is?'});
    if (conf) {
      const present = conf.people.filter(p => p.present).length;
      const strips = conf.people.filter(p => p.charge === 'strip').length;
      return top + `<div class="pad"><div class="confirmed-box">✓ Presentie bevestigd: ${present} aanwezig, ${strips} ${strips === 1 ? 'strip' : 'strippen'} afgeschreven</div>
        ${conf.people.map(p => `<div class="row tight ${p.present ? 'checked' : ''}" style="${p.present ? '' : 'opacity:.55'}"><div class="ini">${initials(p.name)}</div>
          <div class="meta"><div class="nm">${esc(p.name)}${p.app ? ' 📱' : ''}</div>${chargeTag(p)}</div></div>`).join('')}
        <div class="cta outline" style="margin-top:12px" data-act="askUndoConfirm" ${at(sid, d)}>Bevestiging ongedaan maken</div></div>`;
    }
    const list = attendanceList(sid, d);
    const presentN = list.filter(p => p.present).length;
    const addable = students().filter(u => !list.some(p => p.pid === u.email));
    return top + `<div class="pad"><div class="small-note">Volgens de planning staan deze mensen ingepland. Vink uit wie er niet is en voeg toe wie er extra is. De strippen gaan pas af als je bevestigt.</div>
      ${list.map(p => `<div class="row tight ${p.present ? 'checked' : ''}"><div class="chk ${p.present ? 'on' : ''}" data-act="togglePresent" ${at(sid, d)} data-pid="${p.pid}">${p.present ? '✓' : ''}</div><div class="ini">${initials(p.name)}</div>
        <div class="meta"><div class="nm">${esc(p.name)}${p.app ? ' 📱' : ''}</div><div class="st">${p.walkin ? 'losse deelnemer' : `${stripsOf(p, sid)} strippen`}${p.planned ? '' : ' · toegevoegd'}${p.present ? '' : ' · afwezig'}</div></div>
        ${p.planned ? '' : `<div class="circ rm" data-act="removeAttendee" ${at(sid, d)} data-pid="${p.pid}">✕</div>`}</div>`).join('') || '<div class="empty">Niemand ingepland.</div>'}
      <div class="panel" style="margin-top:8px"><div class="lbl">Iemand toevoegen</div>
        ${addable.length ? `<div class="addrow"><select data-av="email"><option value="">Klant met de app…</option>${addable.map(u => `<option value="${u.email}" ${UI.av.email === u.email ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select><div class="obtn teal" data-act="addKlant" ${at(sid, d)}>Toevoegen</div></div>` : ''}
        <div class="addrow"><input type="text" data-av="walkin" value="${esc(UI.av.walkin)}" placeholder="Naam losse deelnemer"><div class="obtn teal" data-act="addWalkin" ${at(sid, d)}>Toevoegen</div></div></div>
      <div class="cta ${started ? '' : 'off'}" ${started ? `data-act="askConfirmAttendance" ${at(sid, d)}` : ''}>${started ? `Bevestig presentie (${presentN} aanwezig)` : `Bevestigen kan vanaf ${s.time.split(' – ')[0]}`}</div></div>`;
  },
};

/* ── Overlays ───────────────────────────────────────────────────────── */
const sheetWrap = (inner) => `<div class="backdrop" data-act="closeSheet"><div class="sheet" data-act="noop"><div class="x" data-act="closeSheet">✕</div><div class="handle"></div>${inner}</div></div>`;
// De beheerder ziet in het lesvenster alle deelnemers, met daaronder "Klant toevoegen".
function participantsPanel(sid, d){
  const o = occ(sid, d); const started = hasStarted(sid, d);
  if (UI.picking) {
    const q = (UI.pickQ || '').toLowerCase();
    const pickable = students().filter(u => !enrollmentOf(u.email, sid, d) && !attendees(sid, d).some(a => a.user.email === u.email))
      .filter(u => !q || u.name.toLowerCase().includes(q) || u.email.includes(q)).slice(0, 30);
    return `<div class="sect" style="padding:0;margin:4px 0 6px">Klant toevoegen</div>
      <div class="small-note">Vanaf ${shortDate(d)} elke ${SES[sid].day.toLowerCase()}. Kies 1 week voor een losse les.</div>
      <div class="field" style="margin-bottom:10px"><input type="text" id="pickQ" value="${esc(UI.pickQ || '')}" placeholder="Zoek op naam of e-mail"></div>
      ${pickable.length ? pickable.map(u => `<div class="row tight" data-act="pickUser" data-email="${u.email}"><div class="meta"><div class="nm">${esc(u.name)}</div><div class="dt">${u.strippen === null ? 'geen kaart' : `${u.strippen} strippen`}</div></div><div class="chev">›</div></div>`).join('')
        : '<div class="empty">Geen klant gevonden.</div>'}
      <div class="logout" style="margin-top:6px" data-act="stopPick">Terug naar deelnemers</div>`;
  }
  const att = attendees(sid, d);
  const off = students().filter(u => statusFor(u.email, sid, d)?.cancelled);
  const canAdd = o.available > 0 && !started;
  const srcLabel = (st) => {
    if (st.source === 'aanvraag') return '<span class="tag pend">Aanvraag</span>';
    if (st.source === 'los') return '<span class="tag los">Losse les</span>';
    const left = st.enrollment.weeks - daysBetween(st.enrollment.start, d) / 7;
    return `<span class="tag vast">Vaste klant${st.enrollment.weeks >= 99 ? '' : ` · nog ${left} ${left === 1 ? 'week' : 'weken'}`}</span>`;
  };
  return `<div class="sect" style="padding:0;margin:4px 0 8px">Deelnemers · ${o.booked} / ${o.cap}</div>
    ${att.length ? '' : '<div class="empty" style="margin:6px 0 10px">Nog niemand ingepland.</div>'}
    ${att.map(({user, st}) => `<div class="row tight"><div class="meta"><div class="nm">${esc(user.name)}</div>${srcLabel(st)}</div>
      ${!started && st.source !== 'aanvraag' ? `<div class="circ rm" data-act="askRemove" data-email="${user.email}">✕</div>` : ''}</div>`).join('')}
    ${off.map(u => `<div class="row tight" style="opacity:.6"><div class="meta"><div class="nm">${esc(u.name)}</div>${cancellationOf(u.email, sid, d)?.charged ? '<span class="tag open">Afgemeld &lt; 24 uur · −1 strip</span>' : '<span class="tag off">Afgemeld</span>'}</div></div>`).join('')}
    <div class="cta ${canAdd ? '' : 'off'}" style="margin-top:6px" ${canAdd ? 'data-act="startPick"' : ''}>${started ? 'Les is al begonnen' : canAdd ? '＋ Klant toevoegen' : 'Vol — geen plekken meer'}</div>`;
}
function bookingSheet({sid, d}){
  if (isAdmin()) return bookingSheetBody({sid, d}).replace('class="sheet"', 'class="sheet" style="max-height:82%;overflow-y:auto"');
  return bookingSheetBody({sid, d});
}
function bookingSheetBody({sid, d}){
  const s = SES[sid]; const u = me(); const o = occ(sid, d); const started = hasStarted(sid, d);
  let body = `<h2>${STYLE[s.style].label}</h2><div class="s">${dateLabel(d)} · ${s.time} · Berghem</div>
    <div class="sp" ${o.available <= 0 ? 'style="color:var(--rani)"' : ''}>${o.available <= 0 ? 'Vol' : `${o.available} / ${o.cap} plekken beschikbaar`}</div>${isAdmin() ? '' : `<div class="desc">${DESC[s.style]}</div>`}`;
  const cl = closureOf(sid, d);
  if (cl) {
    body += `<div class="note muted">Deze les vervalt: ${esc(cl.reason)}${cl.from !== cl.to ? ` (${shortDate(cl.from)} – ${shortDate(cl.to)})` : ''}</div>`;
    if (!isAdmin()) return sheetWrap(body + '<div class="cta off">Les vervalt</div>');
    const single = cl.from === cl.to && cl.sessionId === sid;
    return sheetWrap(body + (single
      ? `<div class="cta" style="background:var(--teal)" data-act="reopen" data-cid="${cl.id}">Les toch laten doorgaan</div>`
      : '<div class="small-note">Aanpassen via Profiel → Rooster beheren.</div>'));
  }
  if (isAdmin()) {
    return sheetWrap(body + `<div class="panel"><div class="lbl">Beheer plekken · ${dateLabel(d).toLowerCase()}</div>
      <div class="srow"><span>Totaal aantal plekken</span>${stepper('adjCap', o.cap, at(sid, d))}</div>
      <div class="srow" style="margin-bottom:0"><span>Bezet</span><span style="font-weight:600">${o.booked}</span></div></div>
      ${participantsPanel(sid, d)}
      ${started ? '' : `<div class="cta outline" style="margin-top:10px" data-act="askCloseOne" ${at(sid, d)}>Les laten vervallen op deze datum</div>`}`);
  }
  if (!u) return sheetWrap(body + `<div class="cta" data-act="loginRequired">Inloggen</div>`);
  const st = statusFor(u.email, sid, d);
  if (st && !st.cancelled && st.source !== 'aanvraag') {
    body += `<div class="note">✓ Je staat ingepland (${st.source === 'vast' ? 'vaste les' : 'losse les'})</div>` +
      (started ? '<div class="cta off">Les is al begonnen</div>' : `<div class="cta outline" data-act="askCancel" ${at(sid, d)}>Afmelden voor deze les</div>` +
        (isLateCancel(sid, d) ? `<div class="cancelhint late">Deze les begint binnen ${LATE_CANCEL_HOURS} uur: afmelden kost 1 strip.</div>` : `<div class="cancelhint">Kosteloos afmelden tot ${LATE_CANCEL_HOURS} uur voor aanvang. Daarna gaat er 1 strip af.</div>`));
  } else if (st?.cancelled) {
    const charged = cancellationOf(u.email, sid, d)?.charged;
    body += `<div class="note muted">Je hebt je afgemeld voor deze les${charged ? ` (binnen ${LATE_CANCEL_HOURS} uur, 1 strip afgeschreven)` : ''}</div>` +
      (!started && o.available > 0 ? `<div class="cta" style="background:var(--teal)" data-act="undoCancel" ${at(sid, d)}>Toch weer aanmelden${charged ? ' (strip terug)' : ''}</div>` : '<div class="cta off">Geen plek meer vrij</div>');
  } else if (st?.source === 'aanvraag') {
    body += '<div class="cta off">Aangevraagd — wacht op goedkeuring</div>';
  } else {
    body += o.available <= 0 ? '<div class="cta off">Vol — geen plekken meer</div>' : '<div class="cta" data-act="book">Plek reserveren</div>';
  }
  return sheetWrap(body);
}
function klantSheet({email}){
  const u = userBy(email); if (!u) return '';
  const v = vastLabel(u);
  return sheetWrap(`<h2>${esc(u.name)}</h2><span class="tag org-${u.origin}">${ORIGIN_LABEL[u.origin]}</span>
    <div class="facts"><div>E-mailadres<b>${esc(shownEmail(u.email))}</b></div><div>Telefoon<b>${esc(u.phone || '—')}</b></div>
      <div>Strippen<b>${u.strippen === null ? 'geen kaart' : u.strippen}</b></div><div>Vaste les<b>${v || '—'}</b></div>
      <div>Voorwaarden<b>${u.termsAcceptedAt ? `akkoord ${u.termsAcceptedAt}` : 'nog niet akkoord'}</b></div></div>
    ${u.origin === 'aanvraag' && hasEmail(u.email) ? `<div class="cta outline" style="border-color:var(--ink);color:var(--ink);margin-bottom:10px" data-act="openChat" data-email="${u.email}">💬 Chat met ${esc(u.name.split(' ')[0])}</div>` : ''}
    <div class="cta outline" data-act="askDeleteKlant" data-email="${u.email}">Klant verwijderen</div>`);
}
function requestSheet({id}){
  const r = S.requests.find(x => x.id === id);
  if (!r) return '';
  const s = SES[r.sessionId];
  return sheetWrap(`<h2>${esc(r.name)}</h2><div class="s" style="margin-bottom:0">${STYLE[s.style].label} · ${dateLabel(r.date)} · ${s.time}</div>
    <div style="font:400 12px var(--body);color:#9DAFA2;margin:2px 0 22px">${esc(r.email)}</div>
    <div class="twobtn"><div class="cta" style="background:var(--teal)" data-act="resolve" data-v="1">✓ Goedkeuren</div><div class="cta" data-act="resolve" data-v="0">✕ Weigeren</div></div>`);
}
function weeksPrompt(){
  const p = UI.prompt;
  const title = p.kind === 'add' ? `${p.name} vast inplannen voor hoeveel weken?` : `${p.name} afmelden voor hoeveel weken?`;
  const hint = p.kind === 'add' ? 'Kies 99 voor een doorlopende vaste les.' : 'Kies 99 om de vaste les helemaal te stoppen.';
  return `<div class="backdrop center" data-act="cancelPrompt"><div class="wcard" data-act="noop"><h3>${esc(title)}</h3><p class="wtxt">${hint}</p><div class="lb">Aantal weken</div>
    ${stepper('weeks', p.weeks)}
    <div class="quick">${[1,4,12,99].map(n => `<span data-act="weeksSet" data-v="${n}" class="${p.weeks===n?'on':''}">${n}</span>`).join('')}</div>
    <div class="cta" data-act="confirmPrompt">${p.kind === 'add' ? 'Inplannen' : 'Afmelden'}</div><div class="cancel" data-act="cancelPrompt">Annuleren</div></div></div>`;
}
const confirmBox = () => `<div class="backdrop center" data-act="closeConfirm"><div class="wcard" data-act="noop"><h3>${esc(UI.confirm.title)}</h3><p class="wtxt">${UI.confirm.text}</p>
  <div class="cta" data-act="${UI.confirm.act}">${UI.confirm.ok}</div><div class="cancel" data-act="closeConfirm">Annuleren</div></div></div>`;

/* ── Render ─────────────────────────────────────────────────────────── */
const phoneEl = document.getElementById('phone');
const scrollMemory = {};
const screenKey = () => UI.stack.length ? JSON.stringify(UI.stack.at(-1)) : `tab:${UI.tab}:${UI.tab === 'rooster' ? UI.month : UI.myTab}`;

function render(){
  if (!tabs().some(([k]) => k === UI.tab)) UI.tab = 'rooster';
  const old = phoneEl.querySelector('.scroll');
  if (old) scrollMemory[old.dataset.key] = old.scrollTop;
  const k = screenKey();
  const top = UI.stack.at(-1);
  const body = top ? STACK[top.screen](top) : {rooster:roosterTab, lessen:lessenTab, berichten:berichtenTab, videos:videosTab, profiel:profielTab}[UI.tab]();
  let overlay = '';
  if (UI.sheet?.type === 'booking') overlay = bookingSheet(UI.sheet);
  if (UI.sheet?.type === 'request') overlay = requestSheet(UI.sheet);
  if (UI.sheet?.type === 'klant') overlay = klantSheet(UI.sheet);
  if (UI.prompt) overlay += weeksPrompt();
  if (UI.confirm) overlay += confirmBox();
  if (UI.toast) overlay += `<div class="toast">${UI.toast}</div>`;
  if (UI.push) overlay += `<div class="pushbanner" data-act="openPush"><div class="pi"><img src="logo-mark.png" alt=""></div><div style="flex:1"><div class="pt"><b>Soulful Yoga</b><span>nu</span></div><div class="px">${esc(UI.push.text)}</div></div></div>`;
  const inChat = top?.screen === 'chat';
  const focused = document.activeElement?.id === 'chatInput';
  if (inChat) overlay += `<div class="chatbar"><textarea class="cin" id="chatInput" rows="1" placeholder="Typ een bericht…">${esc(UI.chatDraft)}</textarea><div class="send ${UI.chatDraft.trim() ? '' : 'off'}" data-act="sendChat">➤</div></div>`;
  phoneEl.innerHTML = `<div class="island"></div><div class="scroll" data-key="${esc(k)}">${body}</div>${top ? '' : tabbar()}${overlay}`;
  const sc = phoneEl.querySelector('.scroll');
  sc.scrollTop = inChat ? sc.scrollHeight : scrollMemory[k] || 0;
  if (inChat && focused) { const ci = document.getElementById('chatInput'); ci.focus(); ci.setSelectionRange(ci.value.length, ci.value.length); }
  renderSide();
}
// Pushmelding bovenin de telefoon (demo): tik erop om het bericht te openen.
function showPush(text, open){
  UI.push = {text, open}; render();
  clearTimeout(showPush.t);
  showPush.t = setTimeout(() => { UI.push = null; render(); }, 4500);
}
function showToast(msg){
  UI.toast = msg; render();
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => { UI.toast = null; render(); }, 2200);
}

/* ── Acties ─────────────────────────────────────────────────────────── */
// De les waar "deelnemer toevoegen/afmelden" over gaat: het open lesvenster.
const lessonCtx = () => UI.sheet?.type === 'booking' ? UI.sheet : UI.stack.at(-1);
const num = (v) => Number(v);
const ACTIONS = {
  noop(){},
  tab(el){ UI.tab = el.dataset.v; UI.stack = []; },
  back(){ UI.stack.pop(); UI.picking = false; UI.accountSent = null; },
  push(el){ UI.stack.push({screen:el.dataset.v, sid:el.dataset.sid, d:el.dataset.date}); UI.picking = false; UI.form = {}; UI.formError = null; },
  goRooster(){ UI.stack = []; UI.tab = 'rooster'; },
  filter(el){ UI.filter = el.dataset.v; },
  month(el){ UI.month = Math.max(0, Math.min(MONTHS_AHEAD, UI.month + num(el.dataset.d))); },
  myTab(el){ UI.myTab = el.dataset.v; },

  openClass(el){ UI.sheet = {type:'booking', sid:el.dataset.sid, d:el.dataset.date}; },
  closeSheet(){ UI.sheet = null; UI.picking = false; },
  loginRequired(){ UI.sheet = null; UI.tab = 'profiel'; UI.stack = []; },
  book(){
    const {sid, d} = UI.sheet; const u = me();
    if (!requestLesson(sid, d, u)) return;
    log(`${u.name} vraagt ${lessonName(sid, d)} aan`);
    UI.sheet = null; save(); showToast('Reservering aangevraagd ✓'); return 'rendered';
  },

  // Klant meldt zich af — met bevestiging
  askCancel(el){
    const {sid, date: d} = el.dataset;
    const late = isLateCancel(sid, d), paysStrip = late && (me().strippen ?? 0) > 0;
    UI.confirm = {title:'Afmelden voor deze les?', text:`${lessonName(sid, d)}. ${cancelNotice(late, paysStrip)}`, ok: paysStrip ? 'Afmelden (−1 strip)' : 'Afmelden', act:'doCancel', sid, d};
  },
  doCancel(){
    const {sid, d} = UI.confirm; const u = me();
    cancelLesson(u.email, sid, d, 'klant');
    const charged = cancellationOf(u.email, sid, d)?.charged;
    log(`${u.name} meldt zich af voor ${lessonName(sid, d)}${charged ? ' (binnen 24 uur, −1 strip)' : ''}`);
    UI.confirm = null; UI.sheet = null; save(); showToast(charged ? 'Afgemeld — 1 strip afgeschreven' : 'Afgemeld — telt niet mee'); return 'rendered';
  },
  closeConfirm(){ UI.confirm = null; },
  undoCancel(el){
    const {sid, date: d} = el.dataset; const u = me();
    if (occ(sid, d).available <= 0) return;
    const charged = cancellationOf(u.email, sid, d)?.charged;
    undoCancel(u.email, sid, d); log(`${u.name} meldt zich weer aan voor ${lessonName(sid, d)}`);
    UI.sheet = null; save(); showToast(charged ? 'Weer aangemeld ✓ — strip teruggezet' : 'Weer aangemeld ✓'); return 'rendered';

function handle(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (fn(el) !== 'rendered') render();
}
document.addEventListener('click', handle);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'chatInput' && !e.shiftKey) { e.preventDefault(); ACTIONS.sendChat(); render(); return; }
  if (e.target.id === 'loginEmail' || e.target.id === 'loginPw') { ACTIONS.login(); render(); }
  else if (e.target.closest('#phone input[data-f]') && UI.stack.at(-1)?.screen === 'account-aanvragen' && !UI.accountSent) { ACTIONS.requestAccount(); render(); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'chatInput') { UI.chatDraft = e.target.value; phoneEl.querySelector('.send')?.classList.toggle('off', !UI.chatDraft.trim()); }
  if (e.target.id === 'pickQ') { UI.pickQ = e.target.value; render(); const pi = document.getElementById('pickQ'); pi.focus(); pi.setSelectionRange(pi.value.length, pi.value.length); return; }
  if (e.target.dataset.f === 'kq') { UI.form.kq = e.target.value; render(); const ki = phoneEl.querySelector('input[data-f="kq"]'); ki.focus(); ki.setSelectionRange(ki.value.length, ki.value.length); return; }
  if (e.target.dataset.f === 'q') { UI.form.q = e.target.value; render(); const qi = phoneEl.querySelector('input[data-f="q"]'); qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); return; }
  if (e.target.id === 'loginEmail') UI.loginEmail = e.target.value;
  if (e.target.id === 'loginPw') UI.loginPw = e.target.value;
  if (e.target.dataset.av) UI.av[e.target.dataset.av] = e.target.value;
  if (e.target.id === 'otherUser' && e.target.value) { ACTIONS.quickLogin({dataset: {email: e.target.value}}); render(); }
  if (e.target.dataset.f) UI.form[e.target.dataset.f] = e.target.value;
});
// Datum/keuze bevestigd → opnieuw tekenen (bv. voor het aantal vervallen lessen)
document.addEventListener('change', (e) => { if (e.target.dataset?.f && e.target.type !== 'text') { UI.form[e.target.dataset.f] = e.target.value; render(); } });

        <span class="av ${p.cls}">${p.email ? initials(p.name) : '?'}</span>
        <span><span class="n">${esc(p.name)}</span><br><span class="d">${p.desc}${p.pw ? ` · ${esc(p.email)} / ${esc(p.pw)}` : ''}</span></span></button>`).join('')}
      <select class="sbtn" id="otherUser" style="margin-top:4px; ${S.users.slice(4).some(x => x.email === S.email) ? 'border:2px solid var(--rani)' : ''}">
        <option value="">Andere klant (${S.users.length - 4})…</option>
        ${S.users.slice(4).sort((a, b) => a.name.localeCompare(b.name)).map(x => `<option value="${x.email}" ${S.email === x.email ? 'selected' : ''}>${esc(x.name)} · ${x.strippen === null ? 'geen kaart' : `${x.strippen} strippen`}</option>`).join('')}
      </select>
    </div></div>
    <div class="box"><h2>Demo-tijd</h2>
      <p style="font:600 15px var(--display); color:var(--ink); margin-bottom:6px">${cap1(n.toLocaleDateString('nl-NL', {weekday:'long', day:'numeric', month:'long', year:'numeric'}))} · ${n.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'})}</p>
      <p style="margin-bottom:10px">Spoel de tijd vooruit. Strippen gaan pas af als de beheerder de presentie van een les bevestigt.</p>
      <div style="display:flex; gap:8px"><button class="sbtn" data-act="timeTravel" data-v="1">+1 dag</button><button class="sbtn" style="margin-top:0" data-act="timeTravel" data-v="7">+1 week</button></div>
      <button class="sbtn" style="margin-top:8px" data-act="openVandaag" ${u?.role === 'admin' ? '' : 'disabled title="Alleen als beheerder"'}>Open Docentmodus · Vandaag</button>
      <p style="margin-top:6px; font-size:11.5px">Of als Beheer: Profiel → Vandaag · presentielijst. Op de laptop: <a class="link" href="beheer.html" target="_blank">beheerportaal ↗</a></p>
    </div>
    <div class="box"><h2>Probeer eens</h2><ol class="tips">
      <li>Open als <b>Marieke</b> de tab <b>Mijn lessen</b>: haar vaste dinsdagavond, komende en afgenomen lessen.</li>
      <li>Meld je af voor een komende les en spoel de tijd vooruit met <b>+1 week</b>. Als <b>Beheer</b>: Profiel → Vandaag · presentielijst → bevestig de les. Pas dan gaat er een strip af.</li>
      <li>Reserveer als Marieke een losse les en keur hem als <b>Beheer</b> goed onder Profiel → Reservering aanvragen.</li>
      <li>Tik als beheerder op een les: je ziet direct alle deelnemers. Plan via <b>＋ Klant toevoegen</b> <b>Daan</b> vast in, en kijk als Daan bij Mijn lessen.</li>
      <li>Ga als <b>Beheer</b> naar Profiel → Klanten beheren: voeg een klant zonder app toe (geel) of na een accountaanvraag (groen), of verwijder een klant.</li>
      <li>Zet als Marieke het schuifje bij de Algemene voorwaarden aan; bekijk als Beheer wie akkoord heeft.</li>
      <li>Open als <b>Marieke</b> de tab <b>Berichten</b>: stuur Marjolijn een bericht en lees het nieuws. Wissel naar <b>Beheer</b>: je krijgt een melding en kunt antwoorden. Wissel terug: Marieke ziet "Gelezen" en krijgt een pushmelding.</li>
      <li>Schrijf als <b>Beheer</b> onder Berichten een nieuwsbericht met pushmelding en wissel naar een klant.</li>
      <li>Ga als <b>Beheer</b> naar Profiel → Rooster beheren: voeg een vaste of extra les toe, of plan een vakantie. Kijk daarna als Marieke bij Mijn lessen.</li>
    </ol></div>
    <div class="box"><h2>Wat er gebeurde</h2>
      ${S.log.length ? `<ul class="log">${S.log.map(l => `<li><time>${l.t}</time> ${esc(l.msg)}</li>`).join('')}</ul>` : '<p>Nog niets. Klik rond in de app.</p>'}
      <button class="sbtn" style="margin-top:12px" data-act="reset">Demo resetten</button>
    </div>`;
}

onExternalChange = render;
render();
</script>
</body>
</html>
